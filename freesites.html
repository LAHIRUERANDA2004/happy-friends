<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Websites – Happy Friends</title><link rel="stylesheet" href="style.css"><style>:root{}[data-theme="dark"] body{background:var(--bg);color:var(--ink)}.sites-wrap{max-width:900px;margin:35px auto;padding:18px}.site-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.site-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.site-card h3{margin-bottom:8px}.site-card a{display:inline-block;margin-top:12px;color:var(--pri);font-weight:800}.site-card p{color:var(--mut);font-size:13px;overflow-wrap:anywhere}</style></head><body><div id="authGate" style="min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center"><div class="site-card"><h2>🔒 Members Only</h2><p style="color:var(--mut);margin:10px 0">Free Websites බලන්න Google account එකකින් register / login වෙන්න අවශ්‍යයි.</p><a class="btn" href="index.html">Back to Happy Friends</a></div></div><div id="membersArea" hidden><header class="top"><a class="logo sm" href="index.html">😊 Happy Friends</a><a class="btn ghost" href="index.html">Back to Chat</a></header><main class="sites-wrap"><h1>🌐 Free Websites</h1><p style="color:var(--mut);margin:8px 0 22px">Useful websites shared by the Happy Friends admin.</p><div id="siteGrid" class="site-grid"><p>Loading websites…</p></div></main></div><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script>const firebaseConfig={apiKey:"AIzaSyA0n4NrCBhD-kQ_4ZifeAWVm045Rm8Jdrc",authDomain:"happy-friends-8f840.firebaseapp.com",projectId:"happy-friends-8f840",appId:"1:549080403446:web:fb2a894fddbc135cb24bd7"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));auth.onAuthStateChanged(user=>{if(user&&!user.isAnonymous){document.getElementById('authGate').hidden=true;document.getElementById('membersArea').hidden=false;loadSites()}else{document.getElementById('authGate').hidden=false;document.getElementById('membersArea').hidden=true;}});function loadSites(){firebase.firestore().collection('freeSites').orderBy('createdAt','desc').onSnapshot(s=>{document.getElementById('siteGrid').innerHTML=s.empty?'<p>No websites have been added yet.</p>':s.docs.map(d=>{const x=d.data();return '<article class="site-card"><h3>'+esc(x.name)+'</h3><p>'+esc(x.url)+'</p><a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">Visit website ↗</a></article>'}).join('')},e=>{document.getElementById('siteGrid').textContent='Could not load websites. Check Firebase setup and Firestore rules.'});}</script></body></html>
