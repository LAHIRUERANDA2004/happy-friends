<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Happy Friends Admin</title><link rel="stylesheet" href="admin.css"></head><body>
<div id="login"><div class="box"><h1>Happy Friends Admin</h1><p>Enter admin password, then verify with Google.</p><input id="adminPass" type="password" placeholder="Admin password" autocomplete="current-password"><button id="passLogin">Continue</button><div id="googleStep" hidden><p>Now sign in using the authorized Google account.</p><button id="go">Sign in with Google</button></div><p id="loginMsg" class="note"></p></div></div>
<div id="panel" hidden><header><h1>Happy Friends Admin</h1><span id="who"></span><button id="out">Log out</button></header>
<nav><button class="on" data-t="users">Users (<span id="uc">0</span>)</button><button data-t="chats">All chats</button><button data-t="sites">Free websites</button></nav>
<section id="users"><input id="q" placeholder="Search name or email…"><div class="wrap"><table><thead><tr><th>Name</th><th>Age</th><th>Gender</th><th>Type</th><th>Email</th><th>Coins</th><th>VIP until</th><th>Status</th><th>Actions</th></tr></thead><tbody id="ub"></tbody></table></div></section>
<section id="chats" hidden><p class="note">Chat logs are kept for moderation and safety.</p><div class="wrap"><table><thead><tr><th>Time</th><th>Room</th><th>From</th><th>Message</th></tr></thead><tbody id="cb"></tbody></table></div></section>
<section id="sites" hidden><h2>Add free website</h2><input id="siteName" placeholder="Website name"><input id="siteUrl" placeholder="https://example.com"><button id="addSite">Add website</button><div class="wrap" style="margin-top:14px"><table><thead><tr><th>Name</th><th>URL</th><th>Action</th></tr></thead><tbody id="siteRows"></tbody></table></div></section></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="admin.js"></script></body></html>
